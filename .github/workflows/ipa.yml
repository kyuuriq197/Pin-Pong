name: Build Pin Pong IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project PinPong.xcodeproj \
            -scheme PinPong \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PinPong.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/PinPong.xcarchive/Products/Applications/PinPong.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Pin-Pong-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pin-Pong-unsigned-IPA
          path: Pin-Pong-unsigned.ipa
