name: PinPong

options:
  bundleIdPrefix: com.kyuuriq
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  PinPong:
    type: application
    platform: iOS
    sources:
      - path: PinPongApp.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyuuriq.pin-pong
        CODE_SIGNING_ALLOWED: NO
